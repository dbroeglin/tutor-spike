name: tutor-spike
version: 1.0.0
description: APM project for tutor-spike
author: Dominique Broeglin
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: agent-skills, antigravity, claude, codex, copilot, cursor, gemini, grok-build, kiro, opencode, windsurf
targets:
  - copilot
dependencies:
  apm:
    - anthropics/skills/skills/skill-creator
    - kepano/obsidian-skills/skills/defuddle
    - kepano/obsidian-skills/skills/json-canvas
    - kepano/obsidian-skills/skills/obsidian-bases
    - kepano/obsidian-skills/skills/obsidian-cli
    - kepano/obsidian-skills/skills/obsidian-markdown
  mcp: []
includes: auto
scripts:
  # Setup-time / diagnostic commands, run by a human via `apm run <name>`.
  # APM is NOT executing when a tutoring session starts, so this is deliberately
  # not the session hook -- AGENTS.md is. Same script, honest trigger.
  doctor: uv run scripts/check_env.py
  init: uv run scripts/check_env.py --init
